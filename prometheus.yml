# Только для локальной разработки: Prometheus из compose.yaml (make up)
# забирает метрики pvz, запущенного на машине (make run). Метрики:
# http://localhost:9090, запросы — в README, раздел «Метрики».
global:
  scrape_interval: 5s # локально хочется видеть изменения сразу

scrape_configs:
  - job_name: pvz
    static_configs:
      # pvz запущен не в Docker, а на самой машине.
      - targets: ["host.docker.internal:9000"]
