name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку или PR отменяет устаревший прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия Go из go.mod: CI и локальная сборка не разъезжаются.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          # Та же версия, что локально (см. README, «Разработка»).
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go.mod и go.sum актуальны
        run: go mod tidy -diff

      # Сгенерированный код закоммичен; если контракт или конфиг генерации
      # поменяли без make generate, сборка падает здесь.
      - name: Сгенерированный код актуален
        run: |
          make generate
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: make test

  # Миграции на настоящем Postgres той же версии, что на сервере.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pvz
          POSTGRES_PASSWORD: pvz
          POSTGRES_DB: pvz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pvz -d pvz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://pvz:pvz@localhost:5432/pvz?sslmode=disable
      # Конфиг требует секрет при любой подкоманде; для миграций он не нужен.
      JWT_SECRET: ci-only-secret-0123456789abcdef-0123
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Миграции применяются
        run: go run ./cmd/pvz migrate

      - name: Повторный запуск ничего не меняет
        run: go run ./cmd/pvz migrate

  # Интеграционные тесты против настоящего Postgres (testcontainers поднимает
  # его сам, Docker на раннере есть) и покрытие unit- и интеграционными
  # тестами вместе: ниже 75% сборка падает.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Интеграционные тесты и покрытие
        run: make cover

  # Образ публикуется только после всех проверок, и только на push в main;
  # на PR он просто собирается. Потом сигнал в portfolio: сервер передеплоится.
  image:
    needs: [lint, test, migrations, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hollowkaeden/pvz-service
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Токен: fine-grained PAT с Contents: read and write только на репо portfolio.
      - name: Деплой в portfolio
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN не задан, деплой не запущен"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HollowKaeden/portfolio/dispatches \
            -d '{"event_type":"deploy","client_payload":{"source":"pvz-service","sha":"${{ github.sha }}"}}'
          echo "Деплой portfolio запущен"
