name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку или PR отменяет устаревший прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия Go из go.mod: CI и локальная сборка не разъезжаются.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          # Та же версия, что локально (см. README, «Разработка»).
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go.mod и go.sum актуальны
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: make test
