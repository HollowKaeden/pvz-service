# mockery v3: моки интерфейсов service и events для тестов сервисов и relay.
# Моки лежат рядом с интерфейсами в mocks_test.go и в бинарник не
# попадают. Запуск: make generate.
all: false
dir: "{{.InterfaceDir}}"
filename: mocks_test.go
structname: "mock{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
template: testify
formatter: goimports
log-level: warn
packages:
  github.com/HollowKaeden/pvz-service/internal/service:
    config:
      all: true
  github.com/HollowKaeden/pvz-service/internal/events:
    config:
      all: true
