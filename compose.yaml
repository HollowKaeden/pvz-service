# Только для локальной разработки: make up. Прод-конфигурация (сервисы, лимиты,
# сети, Caddy) живёт в репозитории portfolio, в deploy/compose.yaml.
services:
  postgres:
    image: postgres:16 # та же мажорная версия, что на сервере
    environment:
      # Учётка только для локальной БД, в проде свои пароли из .env сервера.
      POSTGRES_USER: pvz
      POSTGRES_PASSWORD: pvz
      POSTGRES_DB: pvz
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dev/init-billing.sh:/docker-entrypoint-initdb.d/billing.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvz -d pvz"]
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Эти пределы действуют и на будущие топики, включая DLQ.
      KAFKA_LOG_RETENTION_MS: 86400000
      KAFKA_LOG_RETENTION_BYTES: 33554432
      KAFKA_LOG_SEGMENT_BYTES: 8388608
      KAFKA_LOG_ROLL_MS: 3600000
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    mem_limit: 512m

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # На Linux имя host.docker.internal само не появляется (в Docker Desktop
    # оно есть): без этой строки Prometheus не найдёт pvz на машине.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  kafka_data:
